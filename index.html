<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak Angka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Tebak Angka</h1>
        <p>Saya memilih angka dari 1 sampai 100.</p>
        <p>Bisakah kamu menebaknya?</p>

        <input
            type="number"
            id="tebakan"
            min="1"
            max="100"
            placeholder="Masukkan angka..."
        >

        <button id="tombolTebak" onclick="cekTebakan()">
            Tebak!
        </button>

        <p id="pesan">Ayo mulai bermain!</p>
        <p>Jumlah tebakan: <span id="jumlah">0</span></p>

        <button class="ulang" onclick="mulaiUlang()">
            Main Lagi
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
